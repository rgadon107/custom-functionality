<!-- wp:group {"tagName":"main","className":"entry-content","layout":{"type":"constrained"}} -->
<main id="wp--skip-link--target" class="wp-block-group entry-content">

	<!-- wp:group {"className":"custom-tight-card","layout":{"type":"flow"}} -->
	<div class="wp-block-group custom-tight-card">

		<!-- wp:heading {"level":3,"textColor":"brand-text-main","className":"event-date","metadata":{"bindings":{"content":{"source":"gcm/formatted-event-date","args":{"key":"_event_start_date"}}}}} -->
		<h3 class="wp-block-heading event-date has-brand-text-main-color has-text-color">Event Date</h3>
		<!-- /wp:heading -->

		<!-- wp:post-title {"text-align":"left","level":2,"placeholder":"Enter event title","textColor":"brand-text-main","className":"event-title"} /-->

		<!-- wp:group {"className":"presenter-group","layout":{"type":"constrained","justifyContent":"left"}} -->
		<div class="wp-block-group presenter-group">
			<!-- wp:paragraph {"textColor":"brand-text-main","metadata":{"bindings":{"content":{"source":"gcm/event-card-field","args":{"field":"presenter_byline"}}}}} -->
			<p class="has-brand-text-main-color has-text-color"><em>Presented by Speaker</em></p>
			<!-- /wp:paragraph -->

			<!-- wp:paragraph {"className":"presenter-title-and-organization","metadata":{"bindings":{"content":{"source":"gcm/event-card-field","args":{"field":"presenter_org"}}}}} -->
			<p class="presenter-title-and-organization">Title and Organization</p>
			<!-- /wp:paragraph -->
		</div>
		<!-- /wp:group -->

		<!-- wp:group {"className":"event-accordion-content event-accordion-hidden","layout":{"type":"flow"}} -->
		<div id="event-accordion-content" class="wp-block-group event-accordion-content event-accordion-hidden">

			<!-- wp:group {"className":"event-description-group","layout":{"type":"constrained"}} -->
			<div class="wp-block-group event-description-group">
				<!-- wp:post-content {"textColor":"brand-text-main","className":"event-description","layout":{"type":"constrained"}} /-->
			</div>
			<!-- /wp:group -->

			<!-- wp:group {"className":"event-location-group","layout":{"type":"constrained"}} -->
			<div class="wp-block-group event-location-group">
				<!-- wp:paragraph {"backgroundColor":"brand-green-light","textColor":"brand-green-dark","className":"event-location","metadata":{"bindings":{"content":{"source":"gcm/event-card-field","args":{"field":"location_card"}}}}} -->
				<p class="event-location has-brand-green-dark-color has-brand-green-light-background-color has-text-color has-background">Event Location</p>
				<!-- /wp:paragraph -->
			</div>
			<!-- /wp:group -->

			<!-- wp:group {"className":"event-schedule-group","layout":{"type":"constrained"}} -->
			<div class="wp-block-group event-schedule-group">
				<!-- wp:paragraph {"textColor":"brand-text-main","className":"event-schedule","metadata":{"bindings":{"content":{"source":"gcm/event-meta","args":{"key":"_event_schedule"}}}}} -->
				<p class="event-schedule has-brand-text-main-color has-text-color">Event Schedule</p>
				<!-- /wp:paragraph -->
			</div>
			<!-- /wp:group -->

			<!-- wp:paragraph {"textColor":"brand-text-main","className":"dinner-preregistration-notice","metadata":{"bindings":{"content":{"source":"gcm/event-meta","args":{"key":"_event_preregistration_notice"}}}}} -->
			<p class="dinner-preregistration-notice has-brand-text-main-color has-text-color">Dinner preregistration notice</p>
			<!-- /wp:paragraph -->

			<!-- wp:buttons {"className":"register-button","style":{"spacing":{"margin":{"bottom":"1.5rem"}}},"layout":{"type":"flex"}} -->
			<div class="wp-block-buttons register-button" style="margin-bottom:1.5rem">
				<!-- wp:button {"backgroundColor":"brand-green-dark","textColor":"brand-white-lime","fontSize":"small","className":"has-button event-registration-popup-trigger"} -->
				<div class="wp-block-button has-button event-registration-popup-trigger"><a class="wp-block-button__link has-brand-white-lime-color has-brand-green-dark-background-color has-text-color has-background has-small-font-size wp-element-button" href="#">Register for Dinner</a></div>
				<!-- /wp:button -->
			</div>
			<!-- /wp:buttons -->

		</div>
		<!-- /wp:group -->

		<!-- wp:html -->
		<button type="button" id="event-read-more-btn" class="event-read-more-btn" aria-expanded="false" aria-controls="event-accordion-content">
			<span id="toggle-label">Read More</span>
			<svg id="chevron-down" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<polyline points="6 9 12 15 18 9"></polyline>
			</svg>
			<svg id="chevron-up" class="hidden-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<polyline points="18 15 12 9 6 15"></polyline>
			</svg>
		</button>
		<!-- /wp:html -->

	</div>
	<!-- /wp:group -->

</main>
